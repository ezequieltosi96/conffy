# Single entry point: static web app, REST API, and long-lived SSE caption streams.
worker_processes auto;
worker_rlimit_nofile 16384;

events {
    worker_connections 8192;  # each SSE viewer holds 2 (client + upstream)
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain text/vtt;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Docker DNS returns every api replica; nginx balances across them.
    # After `--scale api=N`, run `docker compose restart nginx` to pick up new replicas.
    upstream conffy_api {
        server api:8000;
        keepalive 64;
    }

    # A whole venue often shares one public IP: keep this generous.
    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=50r/s;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Live captions (SSE): no buffering, long timeouts, no rate limit
        location ~ ^/api/sessions/[^/]+/captions/[^/]+/stream$ {
            proxy_pass http://conffy_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            gzip off;
        }

        location /api/ {
            limit_req zone=api_rl burst=200 nodelay;
            proxy_pass http://conffy_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;       # ready for WebSocket audio ingest
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
