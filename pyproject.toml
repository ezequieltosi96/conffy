[project]
name = "conffy"
version = "0.1.0"
description = "Open-source live transcription and translation for conferences"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "pysilero-vad>=3.4,<4",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conffy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
